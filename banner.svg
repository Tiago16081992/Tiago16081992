<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b26"/>
      <stop offset="0.5" stop-color="#24283b"/>
      <stop offset="1" stop-color="#1f2335"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="200" fill="url(#bg)"/>

  <!-- grid -->
  <g stroke="#2ac3de" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="40"  x2="1200" y2="40"/>
    <line x1="0" y1="80"  x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="250" y1="0" x2="250" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="550" y1="0" x2="550" y2="200"/>
    <line x1="700" y1="0" x2="700" y2="200"/>
    <line x1="850" y1="0" x2="850" y2="200"/>
    <line x1="1000" y1="0" x2="1000" y2="200"/>
  </g>

  <!-- terminal window -->
  <rect x="55" y="35" width="330" height="130" rx="10" fill="#16161e" stroke="#3b4261" stroke-width="1.5"/>
  <circle cx="80" cy="57" r="6" fill="#f7768e"/>
  <circle cx="100" cy="57" r="6" fill="#e0af68"/>
  <circle cx="120" cy="57" r="6" fill="#9ece6a"/>
  <text x="145" y="62" fill="#565f89" font-family="monospace" font-size="13">bash — zsh</text>

  <text x="75" y="88" fill="#7dcfff" font-family="monospace" font-size="14">$ </text>
  <text x="97" y="88" fill="#a9b1d6" font-family="monospace" font-size="14">flutter create meu_app</text>
  <text x="75" y="112" fill="#7dcfff" font-family="monospace" font-size="14">$ </text>
  <text x="97" y="112" fill="#a9b1d6" font-family="monospace" font-size="14">git push -u origin</text>
  <text x="75" y="136" fill="#7dcfff" font-family="monospace" font-size="14">$ </text>
  <text x="97" y="136" fill="#a9b1d6" font-family="monospace" font-size="14">code .</text>
  <text x="160" y="136" fill="#565f89" font-family="monospace" font-size="14"># codando...</text>
  <rect x="75" y="146" width="24" height="3" fill="#7aa2f7"/>
  <rect x="75" y="152" width="14" height="3" fill="#7aa2f7" opacity="0.6"/>

  <!-- title -->
  <text x="470" y="95" fill="url(#acc)" font-family="monospace" font-size="38" font-weight="bold">TIAGO CUNHA SILVA</text>
  <text x="470" y="128" fill="#a9b1d6" font-family="monospace" font-size="17">Desenvolvedor de Software</text>
  <text x="470" y="156" fill="#565f89" font-family="monospace" font-size="15">Flutter &amp; Dart &middot; Python &middot; Web &middot; Linux</text>

  <!-- code chips -->
  <rect x="1000" y="70" width="90" height="26" rx="13" fill="#7aa2f7" fill-opacity="0.15" stroke="#7aa2f7"/>
  <text x="1014" y="87" fill="#7aa2f7" font-family="monospace" font-size="13">{ }</text>
  <rect x="1000" y="104" width="90" height="26" rx="13" fill="#9ece6a" fill-opacity="0.15" stroke="#9ece6a"/>
  <text x="1014" y="121" fill="#9ece6a" font-family="monospace" font-size="13">&lt;/&gt;</text>
  <rect x="1000" y="138" width="90" height="26" rx="13" fill="#bb9af7" fill-opacity="0.15" stroke="#bb9af7"/>
  <text x="1014" y="155" fill="#bb9af7" font-family="monospace" font-size="13">=Dart</text>
</svg>